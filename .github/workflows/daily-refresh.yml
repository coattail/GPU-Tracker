name: Hourly GPU price refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "20 * * * *"

concurrency:
  group: gpu-price-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python3 -m pip install --retries 5 --timeout 60 -r requirements.txt
      - name: Refresh and publish prices
        run: bash scripts/refresh_and_publish.sh
